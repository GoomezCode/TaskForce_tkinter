<svg width="470" height="440" viewBox="0 0 470 440" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <!-- Janela -->
  <rect x="0" y="0" width="470" height="440" fill="#e9e9e9" stroke="#9a9a9a" stroke-width="1"/>

  <!-- Barra de titulo -->
  <rect x="0" y="0" width="470" height="28" fill="#2b579a"/>
  <text x="12" y="19" fill="#ffffff" font-size="13" font-weight="bold">TaskForce</text>
  <circle cx="435" cy="14" r="6" fill="#e0e0e0"/>
  <circle cx="453" cy="14" r="6" fill="#e0e0e0"/>

  <!-- Titulo interno -->
  <text x="235" y="58" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a">TaskForce Tkinter</text>

  <!-- Campo de entrada -->
  <rect x="20" y="75" width="430" height="34" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
  <text x="30" y="97" font-size="14" fill="#9a9a9a">Digite o nome da tarefa ou o Id...</text>

  <!-- Botoes -->
  <rect x="70" y="122" width="90" height="32" rx="3" fill="#e1e1e1" stroke="#8a8a8a" stroke-width="1"/>
  <text x="115" y="143" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Criar</text>

  <rect x="190" y="122" width="90" height="32" rx="3" fill="#e1e1e1" stroke="#8a8a8a" stroke-width="1"/>
  <text x="235" y="143" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Deletar</text>

  <rect x="310" y="122" width="90" height="32" rx="3" fill="#e1e1e1" stroke="#8a8a8a" stroke-width="1"/>
  <text x="355" y="143" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Marcar</text>

  <!-- Tabela (Treeview) -->
  <rect x="20" y="170" width="430" height="200" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>

  <!-- Cabecalho da tabela -->
  <rect x="20" y="170" width="430" height="30" fill="#d6d6d6" stroke="#8a8a8a" stroke-width="1"/>
  <text x="55" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Id</text>
  <text x="235" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Tarefa</text>
  <text x="410" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Feito</text>

  <line x1="90" y1="170" x2="90" y2="370" stroke="#c4c4c4" stroke-width="1"/>
  <line x1="380" y1="170" x2="380" y2="370" stroke="#c4c4c4" stroke-width="1"/>

  <!-- Linhas de exemplo -->
  <g font-size="13" fill="#1a1a1a">
    <line x1="20" y1="230" x2="450" y2="230" stroke="#e5e5e5"/>
    <text x="55" y="220" text-anchor="middle">1</text>
    <text x="105" y="220">Estudar FastAPI</text>
    <text x="410" y="220" text-anchor="middle">✔️</text>

    <line x1="20" y1="260" x2="450" y2="260" stroke="#e5e5e5"/>
    <text x="55" y="250" text-anchor="middle">2</text>
    <text x="105" y="250">Fazer deploy no Render</text>
    <text x="410" y="250" text-anchor="middle">✔️</text>

    <line x1="20" y1="290" x2="450" y2="290" stroke="#e5e5e5"/>
    <text x="55" y="280" text-anchor="middle">3</text>
    <text x="105" y="280">Conectar Tkinter na API</text>
    <text x="410" y="280" text-anchor="middle">❌</text>

    <line x1="20" y1="320" x2="450" y2="320" stroke="#e5e5e5"/>
    <text x="55" y="310" text-anchor="middle">4</text>
    <text x="105" y="310">Escrever o README</text>
    <text x="410" y="310" text-anchor="middle">❌</text>
  </g>

  <!-- Label de info -->
  <text x="235" y="405" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e7e34">Tarefa criada com sucesso!</text>
</svg>
